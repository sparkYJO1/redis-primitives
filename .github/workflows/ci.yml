name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The same compose file used locally, so CI and a laptop run identical
      # Redis config - including maxmemory-policy noeviction, which the
      # fencing counter depends on.
      - run: docker compose up -d --wait
      - run: npm test
      - run: npm run experiment:watch-multi
      - if: always()
        run: docker compose down -v
